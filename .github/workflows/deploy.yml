name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deployment at a time; a newer push doesn't cancel one that's running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # The showcase video is stored in Git LFS.

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npx astro build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true # .well-known/ (the OpenPGP key for WKD)

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
